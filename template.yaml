proxy-groups:
  - name: 自动流量
    type: select
    id: auto_traffic
    proxies:
      - ♻️ 最优代理
      - 稳定代理
      - 指定代理
      - 全球直连
  - name: ♻️ 最优代理
    type: url-test
    id: auto_best
    url: https://www.gstatic.com/generate_204
    interval: 3600
    proxies:
      - 香港-ByWave-01
  - name: 稳定代理
    type: fallback
    id: stable_proxy
    url: https://www.gstatic.com/generate_204
    interval: 3600
    proxies:
      - 香港-ByWave-01
  - name: 指定代理
    type: select
    id: specific
    proxies:
      - 全球直连
  - name: 个人偏好
    type: select
    proxies:
      - 自动流量
      - ♻️ 最优代理
      - 指定代理
      - 全球直连
  - name: GFW
    type: select
    proxies:
      - 自动流量
      - ♻️ 最优代理
      - 指定代理
      - 全球直连
  - name: 基础代理
    type: select
    proxies:
      - 自动流量
      - ♻️ 最优代理
      - 指定代理
      - 全球直连
  - name: 漏网之鱼
    type: select
    proxies:
      - 自动流量
      - ♻️ 最优代理
      - 指定代理
      - 全球直连
  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - 指定代理
      - ♻️ 最优代理
      - 稳定代理
